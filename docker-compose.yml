services:
  postgres:
    image: postgres:16-alpine
    container_name: family-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_pgdata:/var/lib/postgresql/data

volumes:
  finance_pgdata:
