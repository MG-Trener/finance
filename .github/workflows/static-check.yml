name: Static integrity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/static-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/static-check.yml'

permissions:
  contents: read

concurrency:
  group: static-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check static file graph
        run: node tests/static-integrity.mjs
