name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-mobile.mjs'
      - 'mobile-assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled offline web app
        run: npm run mobile:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile-assets --iconBackgroundColor '#071019' --iconBackgroundColorDark '#071019' --splashBackgroundColor '#071019' --splashBackgroundColorDark '#071019'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure stable debug signing
        shell: bash
        run: |
          base64 --decode mobile-assets/debug-keystore.b64 > android/app/family-treasury-debug.jks
          cat > android/app/debug-signing.gradle <<'EOF'
          android {
            signingConfigs {
              debug {
                storeFile file('family-treasury-debug.jks')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.debug
              }
            }
          }
          EOF
          echo "apply from: 'debug-signing.gradle'" >> android/app/build.gradle

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure stable release signing when secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Release signing secrets are not configured; signed release APK is skipped.'
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/family-treasury-release.jks
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file('family-treasury-release.jks')
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "apply from: 'release-signing.gradle'" >> android/app/build.gradle
          touch android/.release-signing-ready

      - name: Build signed release APK when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f android/.release-signing-ready ]; then
            echo 'Signed release build skipped.'
            exit 0
          fi
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30
