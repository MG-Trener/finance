name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'mobile-assets/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'mobile-assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-capacitor-${{ hashFiles('package.json', 'capacitor.config.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-capacitor-
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Prepare bundled offline web app
        env:
          FINANCE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run mobile:prepare

      - name: Optimize family crest for Android
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          crest = Path('www/assets/gerb.png')
          before = crest.stat().st_size

          with Image.open(crest) as source:
              source.load()
              image = source.copy()

          max_edge = 512
          if max(image.size) > max_edge:
              image.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS, reducing_gap=3.0)

          image.save(crest, format='PNG', optimize=True, compress_level=9)
          after = crest.stat().st_size

          print(
              f'Family crest for Android: '
              f'{before / 1024:.1f} KiB -> {after / 1024:.1f} KiB; '
              f'{image.width}x{image.height}px'
          )

          if after >= before:
              raise SystemExit('Android crest optimization did not reduce the file size')
          if after > 1024 * 1024:
              raise SystemExit(f'Android crest is still too large: {after} bytes')
          PY

      - name: Verify local Android fonts
        shell: bash
        run: |
          test -f www/assets/fonts/mobile-fonts.css
          grep -q 'assets/fonts/mobile-fonts.css' www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase push notifications
        shell: bash
        run: |
          if [ -f mobile-assets/google-services.json ]; then
            cp mobile-assets/google-services.json android/app/google-services.json
            echo 'Firebase google-services.json installed.'
          else
            echo 'Firebase google-services.json is not present yet; APK will build with push transport disabled.'
          fi

      - name: Generate native icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile-assets --iconBackgroundColor '#071019' --iconBackgroundColorDark '#071019' --splashBackgroundColor '#071019' --splashBackgroundColorDark '#071019'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android system UI
        run: node scripts/configure-android-ui.mjs

      - name: Lock Android to portrait orientation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          pattern = re.compile(r'(<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*)(>)', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('MainActivity was not found in AndroidManifest.xml')
          activity = match.group(1)
          if 'android:screenOrientation=' not in activity:
              activity += '\n            android:screenOrientation="portrait"'
              text = text[:match.start(1)] + activity + text[match.end(1):]
              manifest.write_text(text, encoding='utf-8')
          if 'android:screenOrientation="portrait"' not in manifest.read_text(encoding='utf-8'):
              raise SystemExit('Portrait orientation lock was not applied')
          PY
          grep -n 'screenOrientation' android/app/src/main/AndroidManifest.xml

      - name: Add native background updater
        run: node scripts/inject-native-updater.mjs

      - name: Verify Android status-bar inset protection
        shell: bash
        run: |
          MAIN_ACTIVITY='android/app/src/main/java/kz/mgtrener/familyfinance/MainActivity.java'
          grep -q 'setOnApplyWindowInsetsListener' "$MAIN_ACTIVITY"
          grep -q 'Type.statusBars()' "$MAIN_ACTIVITY"
          echo 'Android status-bar inset protection is present in final MainActivity.'

      - name: Verify Android target API
        shell: bash
        run: |
          echo 'Generated Android SDK configuration:'
          grep -R -E 'compileSdkVersion|targetSdkVersion|compileSdk |targetSdk ' android/variables.gradle android/app/build.gradle || true
          if ! grep -R -E 'targetSdkVersion[ =]+36|targetSdk[ =]+36' android/variables.gradle android/app/build.gradle >/dev/null; then
            echo 'Android target API 36 was expected.'
            exit 1
          fi

      - name: Set Android build version
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1/versionCode ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${BUILD_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Configure stable sideload signing
        shell: bash
        run: |
          base64 --decode mobile-assets/debug-keystore.b64 > android/app/family-treasury-debug.jks
          cat > android/app/debug-signing.gradle <<'EOF'
          android {
            signingConfigs {
              debug {
                storeFile file('family-treasury-debug.jks')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.debug
              }
            }
          }
          EOF
          echo "apply from: 'debug-signing.gradle'" >> android/app/build.gradle

      - name: Detect production signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo 'RELEASE_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
          else
            echo 'RELEASE_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'Production signing secrets are not configured; stable sideload APK will still be built.'
          fi

      - name: Configure production release signing
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/family-treasury-release.jks
          cat > android/app/release-signing.gradle <<EOF
          android {
            signingConfigs {
              release {
                storeFile file('family-treasury-release.jks')
                storePassword '${ANDROID_KEYSTORE_PASSWORD}'
                keyAlias '${ANDROID_KEY_ALIAS}'
                keyPassword '${ANDROID_KEY_PASSWORD}'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          echo "apply from: 'release-signing.gradle'" >> android/app/build.gradle

      - name: Build installable sideload APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build production-signed APK
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare downloadable APK
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk family-treasury.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "family-treasury-${BUILD_NUMBER}.apk"

      - name: Prepare production APK
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk family-treasury-production.apk

      - name: Upload sideload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-apk
          path: family-treasury.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production APK artifact
        if: env.RELEASE_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-production-apk
          path: family-treasury-production.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 'Семейная казна — Android'
          body: |
            Автоматически собранная версия Android-приложения для установки без Google Play.
            Build: ${{ github.run_number }}
            Version: 1.0.${{ github.run_number }}
            Файлы APK подписаны стабильным sideload-ключом и устанавливаются поверх предыдущей тестовой версии.
            Приложение работает только в вертикальной ориентации экрана.
            Приложение само проверяет эту сборку и предлагает обновление.
          prerelease: true
          make_latest: false
          files: |
            family-treasury.apk
            family-treasury-${{ github.run_number }}.apk
          overwrite_files: true
