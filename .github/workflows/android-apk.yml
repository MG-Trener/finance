name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'styles.css'
      - 'hotfix.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'mobile-assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled offline web app
        env:
          FINANCE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run mobile:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile-assets --iconBackgroundColor '#071019' --iconBackgroundColorDark '#071019' --splashBackgroundColor '#071019' --splashBackgroundColorDark '#071019'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add native background updater
        run: node scripts/inject-native-updater.mjs

      - name: Verify Android target API
        shell: bash
        run: |
          echo 'Generated Android SDK configuration:'
          grep -R -E 'compileSdkVersion|targetSdkVersion|compileSdk |targetSdk ' android/variables.gradle android/app/build.gradle || true
          if ! grep -R -E 'targetSdkVersion[ =]+36|targetSdk[ =]+36' android/variables.gradle android/app/build.gradle >/dev/null; then
            echo 'Android target API 36 was expected.'
            exit 1
          fi

      - name: Set Android build version
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1/versionCode ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${BUILD_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Configure stable app signing
        shell: bash
        run: |
          base64 --decode mobile-assets/debug-keystore.b64 > android/app/family-treasury-debug.jks
          cat > android/app/debug-signing.gradle <<'EOF'
          android {
            signingConfigs {
              debug {
                storeFile file('family-treasury-debug.jks')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.debug
              }
            }
          }
          EOF
          echo "apply from: 'debug-signing.gradle'" >> android/app/build.gradle

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare downloadable APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-treasury.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-apk
          path: family-treasury.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling APK update
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 'Семейная казна — Android'
          body: |
            Автоматически собранная версия Android-приложения для установки без Google Play.
            Build: ${{ github.run_number }}
            Version: 1.0.${{ github.run_number }}
            Файл `family-treasury.apk` можно устанавливать поверх предыдущей версии.
            Приложение само проверяет эту сборку. Начиная с версии с нативным обновлятором, APK загружается на телефоне в фоне, а Android показывает только системное подтверждение установки.
          prerelease: true
          make_latest: false
          files: family-treasury.apk
          overwrite_files: true
