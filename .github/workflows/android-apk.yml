name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-mobile.mjs'
      - 'mobile-assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled offline web app
        run: npm run mobile:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile-assets --iconBackgroundColor '#071019' --iconBackgroundColorDark '#071019' --splashBackgroundColor '#071019' --splashBackgroundColorDark '#071019'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-treasury-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
