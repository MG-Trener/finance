name: Optimize splash medallion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-splash-medallion.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNG optimizer
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant

      - name: Optimize medallion within repository budget
        shell: bash
        run: |
          set -euo pipefail
          src='assets/splash-medallion.png'
          tmp='assets/splash-medallion.optimized.png'
          limit=$((1536 * 1024))
          original_size=$(stat -c%s "$src")
          echo "Original size: $original_size bytes"
          file "$src"

          optimize() {
            local quality="$1"
            rm -f "$tmp"
            pngquant --quality="$quality" --speed 1 --strip --force --output "$tmp" "$src" || return 1
            test -s "$tmp"
          }

          optimize '90-100' || optimize '85-95'
          optimized_size=$(stat -c%s "$tmp")

          if (( optimized_size > limit )); then
            optimize '82-94'
            optimized_size=$(stat -c%s "$tmp")
          fi
          if (( optimized_size > limit )); then
            optimize '78-92'
            optimized_size=$(stat -c%s "$tmp")
          fi

          echo "Optimized size: $optimized_size bytes"
          file "$tmp"

          if (( optimized_size > limit )); then
            echo "Optimized PNG still exceeds ${limit} bytes" >&2
            exit 1
          fi
          if (( optimized_size >= original_size )); then
            echo 'Optimization did not reduce file size' >&2
            exit 1
          fi

          mv "$tmp" "$src"

      - name: Commit optimized PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/splash-medallion.png
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize splash medallion asset'
          git push origin HEAD:main
